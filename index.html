    <!-- Inline Script to prevent Theme Flash on load
         Note: This script is deliberately kept inline in the <head> rather than moved to a module
         to ensure it runs synchronously before the DOM renders. This prevents the page from flashing
         white/wrong color before the CSS and theme settings are fully applied.
    -->
    <script>
        (function() {
            const THEME_COLORS = { light: '#fafaf9', dark: '#0c0a09' };
            const savedTheme = localStorage.getItem('chef_digital_theme');
            let theme;
            if (savedTheme) {
                theme = savedTheme;
            } else {
                const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                theme = systemPrefersDark ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-theme', theme);
            const themeColorMeta = document.getElementById('theme-color-meta');
            if (themeColorMeta) {
                themeColorMeta.setAttribute('content', THEME_COLORS[theme]);
            }
        })();
    </script>
