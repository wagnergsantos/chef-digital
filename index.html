<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Livro de receitas, planejamento semanal e lista de compras do Chef Digital.">
    <title>Chef Digital - Meu Livro de Receitas</title>
    <!-- Google Fonts Preconnect & Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <!-- Local Custom CSS (Vanilla CSS Stylesheet) -->
    <link rel="stylesheet" href="estilos.css?v=1.0.1">
    <!-- PWA: Manifest, Ícone e Theme Color -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <meta name="theme-color" id="theme-color-meta" content="#fafaf9">
    <!-- Inline Script to prevent Theme Flash on load
         Note: This script is deliberately kept inline in the <head> rather than moved to a module
         to ensure it runs synchronously before the DOM renders. This prevents the page from flashing
         white/wrong color before the CSS and theme settings are fully applied.
    -->
    <script>
        (function() {
            const THEME_COLORS = { light: '#fafaf9', dark: '#0c0a09' };
            const savedTheme = localStorage.getItem('chef_digital_theme');
            let theme;
            if (savedTheme) {
                theme = savedTheme;
            } else {
                const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                theme = systemPrefersDark ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-theme', theme);
            const themeColorMeta = document.getElementById('theme-color-meta');
            if (themeColorMeta) {
                themeColorMeta.setAttribute('content', THEME_COLORS[theme]);
            }
        })();
    </script>

</head>
<body>

    <div id="root"></div>

    <!-- Core Logic Entry Point (React) -->
    <script type="module" src="./src/main.jsx"></script>

<!-- impeccable-live-start -->

<!-- impeccable-live-end -->
</body>
</html>
