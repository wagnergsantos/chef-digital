<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Chef Digital</title>
  <script type="module" crossorigin src="/chef-digital/assets/admin-Cl657f8h.js"></script>
  <link rel="modulepreload" crossorigin href="/chef-digital/assets/supabase-DAJto-i6.js">
  <link rel="stylesheet" crossorigin href="/chef-digital/assets/admin-mJdibmSX.css">
<link rel="manifest" href="/chef-digital/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/chef-digital/registerSW.js"></script></head>
<body class="bg-neutral-bg">
    <!-- Botão para voltar ao livro de receitas -->
    <div class="max-w-2xl mx-auto mt-6 px-4">
        <a href="index.html" class="admin-btn admin-btn-secondary admin-btn-link">
            ← Voltar ao Livro de Receitas
        </a>
    </div>

    <form id="login-container" class="max-w-md mx-auto admin-card admin-login-container">
        <h2 class="section-title" style="margin-top: 0;">Acesso Administrativo</h2>
        <div class="form-group">
            <label class="form-label" for="email">E-mail</label>
            <input type="email" id="email" class="form-input" placeholder="seu-email@exemplo.com" required>
        </div>
        <div class="form-group">
            <label class="form-label" for="password">Senha</label>
            <input type="password" id="password" class="form-input" placeholder="••••••••" required>
        </div>
        <div id="login-error" class="admin-error-box"></div>
        <button type="submit" id="btn-login" class="admin-btn admin-btn-primary admin-btn-full">Entrar</button>
    </form>

    <form id="admin-panel" class="hidden max-w-2xl mx-auto admin-card mb-20">
        <div class="admin-header-flex mb-6">
            <h2 class="section-title" style="margin: 0; border: none; padding: 0;">Painel de Receitas</h2>
            <button type="button" id="btn-logout" class="admin-btn admin-btn-secondary">Sair</button>
        </div>

        <!-- Seletor de Receita para Edição -->
        <div class="admin-edit-section">
            <span class="admin-edit-section-label">✏️ Editar Receita Existente</span>
            <div class="admin-edit-row">
                <div class="admin-recipe-combobox" id="recipe-combobox-wrapper">
                    <input
                        type="text"
                        id="recipe-search"
                        class="form-input admin-recipe-search-input"
                        placeholder="Buscar receita pelo nome..."
                        autocomplete="off"
                        aria-label="Buscar receita para editar"
                        aria-autocomplete="list"
                        aria-controls="recipe-dropdown"
                        aria-expanded="false"
                    >
                    <input type="hidden" id="recipe-select">
                    <div id="recipe-dropdown" class="admin-recipe-dropdown" role="listbox" aria-label="Receitas encontradas"></div>
                </div>
                <button type="button" id="btn-load-recipe" class="admin-btn admin-btn-secondary" aria-label="Carregar receita selecionada para edição">Carregar</button>
                <button type="button" id="btn-delete-recipe" class="admin-btn admin-btn-danger" aria-label="Excluir receita selecionada">Excluir</button>
            </div>
        </div>

        <!-- Banner de Modo Edição (oculto por padrão) -->
        <div id="edit-mode-banner" class="admin-edit-banner" style="display:none;" role="status" aria-live="polite">
            <span class="admin-edit-banner-text">✏️ <span id="edit-mode-title">Editando receita</span></span>
            <button type="button" id="btn-new-recipe" class="admin-btn-new-recipe" aria-label="Cancelar edição e criar nova receita">+ Nova Receita</button>
        </div>

        <!-- Gemini Import Box -->
        <div class="form-group admin-gemini-box">
            <label class="form-label admin-gemini-label" for="gemini-json-input">🪄 Importação Inteligente com IA</label>
            <textarea id="gemini-json-input" class="form-input admin-gemini-textarea" placeholder="Cole aqui qualquer texto ou link (URL) de receita..." rows="3" aria-label="Texto ou URL da receita para importação inteligente"></textarea>
            <button type="button" id="btn-import-gemini" class="admin-btn admin-btn-secondary admin-gemini-btn" aria-label="Importar e preencher receita com IA">🪄 Processar e Preencher com IA</button>
            <div id="import-status" class="admin-error-box mt-2" style="display: none;"></div>
        </div>

        <div class="form-group">
            <label class="form-label" for="recipe-title">Título da Receita</label>
            <input type="text" id="recipe-title" class="form-input" placeholder="Ex: Risoto de Alho Poró" required>
        </div>

        <div class="admin-form-grid-2">
            <div class="form-group">
                <label class="form-label" for="recipe-emoji">Emoji</label>
                <input type="text" id="recipe-emoji" class="form-input" placeholder="🍲">
            </div>
            <div class="form-group">
                <label class="form-label" for="recipe-image">Arquivo de Imagem (opcional)</label>
                <input type="text" id="recipe-image" class="form-input" placeholder="Ex: 10.png">
            </div>
        </div>

        <div class="admin-form-grid-2">
            <div class="form-group">
                <label class="form-label" for="recipe-servings">Rendimento (porções)</label>
                <input type="number" id="recipe-servings" class="form-input" placeholder="Ex: 4" min="1">
            </div>
            <div class="form-group">
                <label class="form-label" for="recipe-prep-time">Tempo de Preparo (min)</label>
                <input type="number" id="recipe-prep-time" class="form-input" placeholder="Ex: 15" min="0">
            </div>
        </div>

        <div class="admin-form-grid-2">
            <div class="form-group">
                <label class="form-label" for="recipe-cook-time">Tempo de Cozimento (min)</label>
                <input type="number" id="recipe-cook-time" class="form-input" placeholder="Ex: 45" min="0">
            </div>
            <div class="form-group">
                <label class="form-label" for="recipe-author">Autor / Fonte</label>
                <input type="text" id="recipe-author" class="form-input" placeholder="Ex: Rita Lobo / Panelinha">
            </div>
        </div>

        <div class="form-group">
            <label class="form-label" for="recipe-source-url">URL da Fonte Original (opcional)</label>
            <input type="url" id="recipe-source-url" class="form-input" placeholder="https://...">
        </div>

        <div class="form-group">
            <label class="form-label" for="recipe-tips">Dica rápida (opcional)</label>
            <input type="text" id="recipe-tips" class="form-input" placeholder="Ex: Sirva bem quente com parmesão">
        </div>

        <div class="form-group">
            <label class="form-label">Categoria principal</label>
            <div id="categories-container" class="admin-categories-grid">
                <!-- Carregado via JS -->
            </div>
        </div>

        <div class="form-group">
            <label class="form-label" for="tag-input">Tags da receita (contexto, ocasiões, temas)</label>
            <div id="tags-chips-container" class="admin-tags-chips-container mb-2"></div>
            <div class="admin-tag-input-flex">
                <div class="admin-tag-autocomplete-wrapper" style="flex:1;">
                    <input type="text" id="tag-input" class="form-input" placeholder="Digite uma tag (ex: Natal, Fit, Airfryer) e pressione Enter..." autocomplete="off" aria-label="Campo de tag" aria-autocomplete="list" aria-controls="tag-suggestions">
                    <div id="tag-suggestions" class="admin-tag-suggestions" role="listbox" aria-label="Sugestões de tags"></div>
                </div>
                <button type="button" id="btn-add-tag" class="admin-btn admin-btn-secondary" aria-label="Adicionar tag">+ Tag</button>
            </div>
        </div>
        
        <h3 class="section-title">Ingredientes</h3>
        <div id="ingredients-list" class="mb-4"></div>
        <button type="button" id="btn-add-ingredient" class="admin-btn admin-btn-secondary">+ Adicionar Ingrediente</button>

        <h3 class="section-title">Modo de Preparo</h3>
        <div id="steps-list" class="mb-4"></div>
        <button type="button" id="btn-add-step" class="admin-btn admin-btn-secondary">+ Adicionar Passo</button>

        <div class="form-group" style="margin-top: 32px;">
            <div id="recipe-error" class="admin-error-box"></div>
            <button type="submit" id="btn-save" class="admin-btn admin-btn-primary admin-btn-full admin-btn-success" aria-label="Salvar receita">Publicar Receita</button>
        </div>
    </form>

</body>
</html>
